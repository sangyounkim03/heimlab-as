<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>A/S 신청 | DNB PARTNER</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f4f6f8;
            color: #222;
        }

        header {
            padding:
                calc(18px + env(safe-area-inset-top))
                20px
                18px;

            background: #fff;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        header a {
            color: #082d5c;
            font-size: 27px;
            font-weight: 800;
            letter-spacing: 2px;
            text-decoration: none;
        }

        header span {
            color: #b98740;
        }

        .form-container {
            width: calc(100% - 32px);
            max-width: 650px;

            margin: 35px auto;

            padding: 32px;

            background: #fff;

            border-radius: 16px;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.07);
        }

        h1 {
            margin:
                0
                0
                12px;

            color: #082d5c;

            font-size: 28px;
            text-align: center;
        }

        .description {
            margin:
                0
                0
                24px;

            color: #666;

            font-size: 15px;
            line-height: 1.7;
            text-align: center;
        }

        .selected-brand {
            margin-bottom: 25px;

            padding: 15px;

            background: #eef4fb;

            border:
                1px solid
                #d4e2f2;

            border-radius: 10px;

            color: #123d70;

            font-size: 16px;
            font-weight: 700;
            text-align: center;
        }

        .mobile-guide {
            display: none;

            margin-bottom: 22px;

            padding: 14px;

            background: #fff8e8;

            border:
                1px solid
                #f1d795;

            border-radius: 10px;

            color: #725500;

            font-size: 14px;
            line-height: 1.6;
            text-align: center;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #333;

            font-size: 15px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 14px;

            border:
                1px solid
                #cfcfcf;

            border-radius: 9px;

            background: #fff;

            color: #222;

            /*
                16px 이상:
                iPhone 입력 시
                자동 확대 방지
            */
            font-size: 16px;

            font-family: inherit;

            appearance: none;
            -webkit-appearance: none;
        }

        select {
            background-image:
                linear-gradient(
                    45deg,
                    transparent 50%,
                    #555 50%
                ),
                linear-gradient(
                    135deg,
                    #555 50%,
                    transparent 50%
                );

            background-position:
                calc(100% - 20px)
                calc(50% - 3px),

                calc(100% - 15px)
                calc(50% - 3px);

            background-size:
                5px 5px,
                5px 5px;

            background-repeat:
                no-repeat;

            padding-right: 42px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #123d70;

            outline: none;

            box-shadow:
                0 0 0 3px
                rgba(18, 61, 112, 0.12);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        .submit-btn,
        .copy-btn,
        .move-btn {
            width: 100%;

            min-height: 52px;

            padding: 14px 18px;

            border: none;
            border-radius: 12px;

            color: #fff;

            font-family: inherit;
            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            touch-action: manipulation;
        }

        .submit-btn {
            margin-top: 4px;

            background: #123d70;
        }

        .submit-btn:hover {
            background: #082d5c;
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-box {
            display: none;

            margin-top: 22px;

            padding: 20px;

            background: #eef6ff;

            border:
                1px solid
                #b8d6ff;

            border-radius: 12px;

            color: #123d70;

            font-size: 15px;
            line-height: 1.8;
            text-align: center;
        }

        .receipt-number {
            display: inline-block;

            margin: 6px 0;

            color: #082d5c;

            font-size: 19px;
            font-weight: 800;

            word-break: break-all;
        }

        .paste-guide {
            margin-top: 15px;

            padding: 14px;

            background: #eaf7ee;

            border:
                1px solid
                #b9dfc3;

            border-radius: 9px;

            color: #17632d;

            font-size: 14px;
            line-height: 1.7;
        }

        .photo-notice {
            margin-top: 12px;

            padding: 14px;

            background: #fff8e8;

            border:
                1px solid
                #f1d795;

            border-radius: 9px;

            color: #725500;

            font-size: 14px;
            line-height: 1.7;
        }

        .copy-btn {
            display: none;

            margin-top: 12px;

            background: #4b5563;
        }

        .copy-btn:hover {
            background: #374151;
        }

        .move-btn {
            display: none;

            margin-top: 10px;

            background: #15803d;
        }

        .move-btn:hover {
            background: #166534;
        }

        .back-btn {
            display: block;

            margin-top: 20px;

            padding: 10px;

            color: #555;

            font-size: 14px;
            text-align: center;
            text-decoration: none;
        }

        /*
            모바일
        */
        @media (max-width: 600px) {

            body {
                background: #f4f6f8;
            }

            header {
                padding:
                    calc(
                        16px +
                        env(safe-area-inset-top)
                    )
                    15px
                    16px;
            }

            header a {
                font-size: 23px;
            }

            .form-container {
                width: 100%;

                margin: 0;

                padding:
                    25px
                    18px
                    calc(
                        35px +
                        env(safe-area-inset-bottom)
                    );

                border-radius: 0;

                box-shadow: none;
            }

            h1 {
                font-size: 25px;
            }

            .description {
                font-size: 14px;
            }

            .selected-brand {
                padding: 14px 12px;

                font-size: 15px;
            }

            .mobile-guide {
                display: block;
            }

            .form-group {
                margin-bottom: 18px;
            }

            input,
            select,
            textarea {
                min-height: 50px;

                padding: 14px;

                font-size: 16px;

                border-radius: 10px;
            }

            textarea {
                min-height: 135px;
            }

            .submit-btn,
            .copy-btn,
            .move-btn {
                min-height: 54px;

                font-size: 16px;

                border-radius: 12px;
            }

            .result-box {
                padding: 18px 14px;

                font-size: 14px;
            }

            .receipt-number {
                font-size: 18px;
            }

            .back-btn {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="Home.html">
        DNB <span>PARTNER</span>
    </a>
</header>


<main class="form-container">

    <h1>A/S 신청</h1>

    <p class="description">
        신청서를 한 번만 작성해주세요.<br>
        접수 완료 후 신청 내용이 자동으로 복사되고<br>
        해당 브랜드 A/S 채널로 이동합니다.
    </p>


    <div
        class="selected-brand"
        id="selectedBrand"
    >
        선택 브랜드 확인 중...
    </div>


    <div
        class="mobile-guide"
        id="mobileGuide"
    >
        📱 모바일 A/S 접수 안내<br>
        접수 후 업체 상담창이 열리면
        입력창을 길게 눌러
        <strong>붙여넣기</strong>를 선택하고,
        제품 사진을 첨부해주세요.
    </div>


    <form id="asForm">

        <div class="form-group">

            <label for="customerName">
                고객명
            </label>

            <input
                type="text"
                id="customerName"
                required
                autocomplete="name"
                placeholder="고객명을 입력하세요"
            >

        </div>


        <div class="form-group">

            <label for="phone">
                연락처
            </label>

            <input
                type="tel"
                id="phone"
                required
                autocomplete="tel"
                inputmode="tel"
                placeholder="010-1234-5678"
            >

        </div>


        <div class="form-group">

            <label for="brand">
                브랜드
            </label>

            <select
                id="brand"
                required
            >
                <option value="">
                    브랜드 선택
                </option>

                <option value="아메리칸 스탠다드">
                    아메리칸 스탠다드
                </option>

                <option value="더죤(필로토)">
                    더죤(필로토)
                </option>

                <option value="폰타나">
                    폰타나
                </option>

                <option value="에떼르노">
                    에떼르노
                </option>

                <option value="리델">
                    리델
                </option>

                <option value="힘펠">
                    힘펠
                </option>

                <option value="히든바스">
                    히든바스
                </option>

                <option value="트렌드주식회사">
                    트렌드주식회사
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="product">
                제품명
            </label>

            <input
                type="text"
                id="product"
                required
                placeholder="예: 세면기, 양변기, 수전"
            >

        </div>


        <div class="form-group">

            <label for="address">
                주소
            </label>

            <input
                type="text"
                id="address"
                required
                autocomplete="street-address"
                placeholder="A/S 방문 주소를 입력하세요"
            >

        </div>


        <div class="form-group">

            <label for="content">
                A/S 내용
            </label>

            <textarea
                id="content"
                required
                placeholder="제품의 문제를 자세히 작성하세요"
            ></textarea>

        </div>


        <button
            type="submit"
            class="submit-btn"
            id="submitButton"
        >
            A/S 접수하기
        </button>

    </form>


    <div
        class="result-box"
        id="resultBox"
    ></div>


    <button
        type="button"
        class="copy-btn"
        id="copyButton"
    >
        신청내용 다시 복사하기
    </button>


    <button
        type="button"
        class="move-btn"
        id="moveButton"
    >
        해당 업체 A/S 채널로 이동
    </button>


    <a
        href="AsService.html"
        class="back-btn"
    >
        ← 브랜드 선택으로 돌아가기
    </a>

</main>


<script type="module">

    import { db }
    from "./firebase-config.js";


    import {
        getApp
    }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    import {
        collection,
        doc,
        writeBatch,
        serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    const app =
        getApp();

    const auth =
        getAuth(app);


    const asForm =
        document.getElementById(
            "asForm"
        );

    const submitButton =
        document.getElementById(
            "submitButton"
        );

    const resultBox =
        document.getElementById(
            "resultBox"
        );

    const brandSelect =
        document.getElementById(
            "brand"
        );

    const selectedBrand =
        document.getElementById(
            "selectedBrand"
        );

    const copyButton =
        document.getElementById(
            "copyButton"
        );

    const moveButton =
        document.getElementById(
            "moveButton"
        );

    const mobileGuide =
        document.getElementById(
            "mobileGuide"
        );


    let copiedText = "";
    let destinationUrl = "";
    let redirectTimer = null;


    /*
        모바일 여부 확인
    */
    const isMobile =
        window.matchMedia(
            "(max-width: 768px)"
        ).matches ||
        /Android|iPhone|iPad|iPod/i.test(
            navigator.userAgent
        );


    /*
        카카오톡 채널을 사용하는 브랜드
    */
    const kakaoBrands = [
        "폰타나",
        "에떼르노",
        "트렌드주식회사"
    ];


    /*
        브랜드별 A/S 주소
    */
    const brandLinks = {

        "아메리칸 스탠다드":
            "https://standard-as.co.kr/main/as_afterservice/write.do",

        "더죤(필로토)":
            "https://piloto.co.kr/shop/cs/as_receipt/as_receipt_index",

        "폰타나":
            "https://pf.kakao.com/_xbsqFn",

        "에떼르노":
            "https://pf.kakao.com/_bMtNn",

        "리델":
            "https://liddel.co.kr/board/as-%EB%AC%B8%EC%9D%98/6/",

        "힘펠":
            "https://himpel.com/kr/asApplication",

        "히든바스":
            "https://hiddenbathorder.co.kr/loginForm",

        "트렌드주식회사":
            "https://pf.kakao.com/_CxiAxmxj"
    };


    /*
        로그인 보호
    */
    onAuthStateChanged(
        auth,
        function (user) {

            if (!user) {

                window.location.replace(
                    "index.html"
                );

            }

        }
    );


    /*
        URL에서 브랜드 읽기
    */
    const params =
        new URLSearchParams(
            window.location.search
        );


    const brandFromUrl =
        params.get(
            "brand"
        );


    if (
        brandFromUrl &&
        brandLinks[brandFromUrl]
    ) {

        brandSelect.value =
            brandFromUrl;


        selectedBrand.textContent =
            "선택 브랜드 : " +
            brandFromUrl;

    } else {

        selectedBrand.textContent =
            "A/S 브랜드를 선택해주세요.";

    }


    /*
        PC에서 카카오톡 브랜드 선택 시
        모바일 이용 안내
    */
    function updateDeviceGuide() {

        const brand =
            brandSelect.value;


        if (
            !isMobile &&
            kakaoBrands.includes(brand)
        ) {

            mobileGuide.style.display =
                "block";


            mobileGuide.innerHTML = `
                📱 <strong>모바일 이용 권장</strong><br>
                ${brand} A/S는 카카오톡 상담 채널로 연결됩니다.<br>
                PC보다 휴대폰에서 접수하는 것을 권장합니다.
            `;

        } else if (isMobile) {

            mobileGuide.style.display =
                "block";


            mobileGuide.innerHTML = `
                📱 <strong>모바일 A/S 접수</strong><br>
                접수 후 업체 상담창이 열리면
                입력창을 길게 눌러
                <strong>붙여넣기</strong>를 선택해주세요.<br>
                마지막으로 문제 제품 사진을 첨부한 뒤
                전송해주세요.
            `;

        } else {

            mobileGuide.style.display =
                "none";

        }

    }


    updateDeviceGuide();


    /*
        브랜드 변경
    */
    brandSelect.addEventListener(
        "change",
        function () {

            if (
                brandSelect.value
            ) {

                selectedBrand.textContent =
                    "선택 브랜드 : " +
                    brandSelect.value;

            } else {

                selectedBrand.textContent =
                    "A/S 브랜드를 선택해주세요.";

            }


            updateDeviceGuide();

        }
    );


    /*
        접수번호 생성
    */
    function createReceiptNumber() {

        const now =
            new Date();


        const year =
            now.getFullYear();


        const month =
            String(
                now.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const day =
            String(
                now.getDate()
            ).padStart(
                2,
                "0"
            );


        const randomNumber =
            Math.floor(
                100000 +
                Math.random() * 900000
            );


        return (
            `AS-${year}${month}${day}-${randomNumber}`
        );

    }


    /*
        클립보드 복사
    */
    async function copyToClipboard(
        text
    ) {

        try {

            if (
                navigator.clipboard &&
                window.isSecureContext
            ) {

                await navigator.clipboard.writeText(
                    text
                );


                return true;

            }

        } catch (error) {

            console.warn(
                "Clipboard API 복사 실패:",
                error
            );

        }


        /*
            대체 복사 방식
        */
        try {

            const textArea =
                document.createElement(
                    "textarea"
                );


            textArea.value =
                text;


            textArea.style.position =
                "fixed";


            textArea.style.left =
                "-9999px";


            textArea.style.top =
                "0";


            document.body.appendChild(
                textArea
            );


            textArea.focus();

            textArea.select();


            const successful =
                document.execCommand(
                    "copy"
                );


            document.body.removeChild(
                textArea
            );


            return successful;

        } catch (error) {

            console.error(
                "복사 실패:",
                error
            );


            return false;

        }

    }


    /*
        신청내용 다시 복사
    */
    copyButton.addEventListener(
        "click",
        async function () {

            if (!copiedText) {
                return;
            }


            const success =
                await copyToClipboard(
                    copiedText
                );


            if (success) {

                copyButton.textContent =
                    "✓ 신청내용 복사 완료";


                setTimeout(
                    function () {

                        copyButton.textContent =
                            "신청내용 다시 복사하기";

                    },
                    2000
                );

            } else {

                alert(
                    "자동 복사가 차단되었습니다.\n" +
                    "브라우저의 클립보드 권한을 확인해주세요."
                );

            }

        }
    );


    /*
        업체 채널 이동
    */
    moveButton.addEventListener(
        "click",
        function () {

            if (!destinationUrl) {
                return;
            }


            if (redirectTimer) {

                clearTimeout(
                    redirectTimer
                );

            }


            window.location.href =
                destinationUrl;

        }
    );


    /*
        A/S 접수
    */
    asForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const selectedBrandValue =
                brandSelect.value;


            if (
                !selectedBrandValue ||
                !brandLinks[
                    selectedBrandValue
                ]
            ) {

                alert(
                    "A/S 브랜드를 선택해주세요."
                );


                return;

            }


            /*
                PC + 카카오톡 업체
            */
            if (
                !isMobile &&
                kakaoBrands.includes(
                    selectedBrandValue
                )
            ) {

                const continueOnPc =
                    confirm(
                        selectedBrandValue +
                        " A/S는 카카오톡으로 연결됩니다.\n\n" +
                        "PC에서는 카카오톡 접수가 원활하지 않을 수 있습니다.\n" +
                        "휴대폰 이용을 권장합니다.\n\n" +
                        "그래도 PC에서 계속하시겠습니까?"
                    );


                if (!continueOnPc) {

                    return;

                }

            }


            const customerName =
                document
                    .getElementById(
                        "customerName"
                    )
                    .value
                    .trim();


            const phone =
                document
                    .getElementById(
                        "phone"
                    )
                    .value
                    .trim();


            const product =
                document
                    .getElementById(
                        "product"
                    )
                    .value
                    .trim();


            const address =
                document
                    .getElementById(
                        "address"
                    )
                    .value
                    .trim();


            const content =
                document
                    .getElementById(
                        "content"
                    )
                    .value
                    .trim();


            if (
                !customerName ||
                !phone ||
                !product ||
                !address ||
                !content
            ) {

                alert(
                    "모든 항목을 입력해주세요."
                );


                return;

            }


            /*
                접수번호
            */
            const receiptNumber =
                createReceiptNumber();


            /*
                관리자용 Firebase 데이터
            */
            const applicationData = {

                receiptNumber:
                    receiptNumber,

                customerName:
                    customerName,

                phone:
                    phone,

                brand:
                    selectedBrandValue,

                product:
                    product,

                address:
                    address,

                content:
                    content,

                status:
                    "접수 완료",

                createdAt:
                    serverTimestamp()

            };


            /*
                카카오톡 / 업체 접수창에
                붙여넣을 최종 내용
            */
            copiedText =
`[DNB PARTNER A/S 접수]

접수번호: ${receiptNumber}
브랜드: ${selectedBrandValue}
고객명: ${customerName}
연락처: ${phone}
제품명: ${product}
주소: ${address}
A/S 내용: ${content}

📷 문제 확인을 위해 제품 사진을 함께 첨부해주세요.
문제 부위가 잘 보이도록 촬영하여 보내주시기 바랍니다.`;


            destinationUrl =
                brandLinks[
                    selectedBrandValue
                ];


            try {

                submitButton.disabled =
                    true;


                submitButton.textContent =
                    "접수 중...";


                /*
                    Firestore Batch
                */
                const batch =
                    writeBatch(db);


                /*
                    관리자용 전체 접수 데이터
                */
                const privateRef =
                    doc(
                        collection(
                            db,
                            "asApplications"
                        )
                    );


                batch.set(
                    privateRef,
                    applicationData
                );


                /*
                    현황 조회용 데이터
                */
                const publicRef =
                    doc(
                        db,
                        "asPublicStatus",
                        receiptNumber
                    );


                batch.set(
                    publicRef,
                    {

                        receiptNumber:
                            receiptNumber,

                        brand:
                            selectedBrandValue,

                        product:
                            product,

                        status:
                            "접수 완료",

                        createdAt:
                            serverTimestamp()

                    }
                );


                /*
                    Firebase 저장
                */
                await batch.commit();


                /*
                    내용 자동 복사
                */
                const copySuccess =
                    await copyToClipboard(
                        copiedText
                    );


                /*
                    완료 후 입력창 잠금
                */
                asForm
                    .querySelectorAll(
                        "input, select, textarea"
                    )
                    .forEach(
                        function (element) {

                            element.disabled =
                                true;

                        }
                    );


                submitButton.disabled =
                    true;


                submitButton.textContent =
                    "✓ 접수 완료";


                resultBox.style.display =
                    "block";


                /*
                    기기별 붙여넣기 안내
                */
                const pasteInstruction =
                    isMobile
                    ?
                    `
                    <div class="paste-guide">
                        📱 <strong>다음 단계</strong><br>
                        업체 상담창이 열리면<br>
                        <strong>
                            메시지 입력창을 길게 누르기
                            → 붙여넣기
                        </strong>
                        를 선택해주세요.
                    </div>
                    `
                    :
                    `
                    <div class="paste-guide">
                        💻 <strong>다음 단계</strong><br>
                        업체 상담창에서
                        <strong>Ctrl + V</strong>를 눌러
                        신청 내용을 붙여넣어 주세요.
                    </div>
                    `;


                if (copySuccess) {

                    resultBox.innerHTML = `

                        <strong>
                            A/S 접수가 완료되었습니다.
                        </strong>

                        <br><br>

                        접수번호<br>

                        <span class="receipt-number">
                            ${receiptNumber}
                        </span>

                        <br><br>

                        ✓ 신청 내용이
                        자동으로 복사되었습니다.

                        ${pasteInstruction}

                        <div class="photo-notice">

                            📷 <strong>
                                마지막으로 사진을 첨부해주세요.
                            </strong>

                            <br>

                            문제가 발생한 제품과
                            문제 부위가 잘 보이도록
                            촬영한 사진을 첨부한 뒤

                            <strong>
                                전송
                            </strong>

                            해주세요.

                        </div>

                    `;

                } else {

                    resultBox.innerHTML = `

                        <strong>
                            A/S 접수가 완료되었습니다.
                        </strong>

                        <br><br>

                        접수번호<br>

                        <span class="receipt-number">
                            ${receiptNumber}
                        </span>

                        <br><br>

                        신청 내용 자동 복사가
                        차단되었습니다.

                        <br>

                        아래

                        <strong>
                            신청내용 다시 복사하기
                        </strong>

                        버튼을 먼저 눌러주세요.

                        ${pasteInstruction}

                        <div class="photo-notice">

                            📷 <strong>
                                사진 첨부 필수
                            </strong>

                            <br>

                            업체 상담창에서 신청 내용을
                            붙여넣은 뒤 문제 제품 사진도
                            함께 첨부해주세요.

                        </div>

                    `;

                }


                /*
                    항상 다시 복사 가능
                */
                copyButton.style.display =
                    "block";


                /*
                    업체 이동 버튼
                */
                moveButton.style.display =
                    "block";


                if (isMobile) {

                    moveButton.textContent =
                        selectedBrandValue +
                        " A/S 채널 열기";

                } else {

                    moveButton.textContent =
                        "해당 업체 A/S 채널로 이동";

                }


                /*
                    결과 위치로 이동
                */
                resultBox.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });


                /*
                    자동 이동

                    모바일:
                    안내 확인 시간을 위해 8초

                    PC:
                    8초
                */
                redirectTimer =
                    setTimeout(
                        function () {

                            window.location.href =
                                destinationUrl;

                        },
                        8000
                    );


            } catch (error) {

                console.error(
                    "A/S 접수 오류:",
                    error
                );


                alert(
                    "A/S 접수 중 오류가 발생했습니다.\n" +
                    "잠시 후 다시 시도해주세요."
                );


                submitButton.disabled =
                    false;


                submitButton.textContent =
                    "A/S 접수하기";

            }

        }
    );

</script>

</body>
</html>
