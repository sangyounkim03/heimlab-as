<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A/S 신청 | DNB PARTNER</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            width: 100%;
            padding: 22px 20px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        header a {
            color: #082d5c;
            font-size: 27px;
            font-weight: 800;
            letter-spacing: 2px;
            text-decoration: none;
        }

        header span {
            color: #b98740;
        }

        .form-container {
            width: calc(100% - 40px);
            max-width: 700px;
            margin: 40px auto 70px;
            padding: 35px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
        }

        h1 {
            margin: 0 0 12px;
            color: #082d5c;
            font-size: 28px;
            text-align: center;
        }

        .description {
            margin: 0 0 25px;
            color: #666;
            font-size: 15px;
            line-height: 1.7;
            text-align: center;
        }

        .selected-brand {
            margin-bottom: 25px;
            padding: 15px;
            background: #eef4fb;
            border: 1px solid #d4e2f2;
            border-radius: 10px;
            color: #123d70;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 15px;
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #cfcfcf;
            border-radius: 9px;
            background: #fff;
            color: #222;
            font-size: 15px;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #123d70;
            outline: none;
            box-shadow: 0 0 0 3px rgba(18, 61, 112, 0.12);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        .photo-area {
            padding: 18px;
            background: #f8fafc;
            border: 1px solid #d9e0e7;
            border-radius: 12px;
        }

        .photo-description {
            margin: 0 0 12px;
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        .photo-count {
            margin-top: 10px;
            color: #555;
            font-size: 13px;
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .preview-item {
            overflow: hidden;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fff;
        }

        .preview-item img {
            display: block;
            width: 100%;
            height: 130px;
            object-fit: cover;
        }

        .preview-name {
            padding: 8px;
            color: #555;
            font-size: 11px;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .submit-btn,
        .copy-btn,
        .move-btn,
        .photo-copy-btn {
            width: 100%;
            min-height: 50px;
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn {
            background: #123d70;
        }

        .submit-btn:hover {
            background: #082d5c;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-box {
            display: none;
            margin-top: 22px;
            padding: 20px;
            background: #eef6ff;
            border: 1px solid #b8d6ff;
            border-radius: 12px;
            color: #123d70;
            font-size: 15px;
            line-height: 1.8;
            text-align: center;
        }

        .receipt-number {
            display: inline-block;
            margin: 6px 0;
            color: #082d5c;
            font-size: 20px;
            font-weight: 800;
        }

        .paste-guide {
            margin-top: 15px;
            padding: 15px;
            background: #eaf7ee;
            border: 1px solid #b9dfc3;
            border-radius: 9px;
            color: #17632d;
            font-size: 14px;
            line-height: 1.7;
        }

        .photo-notice {
            margin-top: 12px;
            padding: 15px;
            background: #fff8e8;
            border: 1px solid #f1d795;
            border-radius: 9px;
            color: #725500;
            font-size: 14px;
            line-height: 1.7;
        }

        .copy-btn {
            display: none;
            margin-top: 12px;
            background: #4b5563;
        }

        .photo-buttons {
            display: none;
            margin-top: 12px;
        }

        .photo-copy-btn {
            margin-top: 8px;
            background: #7c3aed;
        }

        .photo-copy-btn.copied {
            background: #15803d;
        }

        .move-btn {
            display: none;
            margin-top: 12px;
            background: #15803d;
        }

        .back-btn {
            display: block;
            margin-top: 20px;
            padding: 10px;
            color: #555;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .form-container {
                width: calc(100% - 24px);
                margin: 20px auto 50px;
                padding: 22px 16px;
            }

            .preview-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<header>
    <a href="Home.html">
        DNB <span>PARTNER</span>
    </a>
</header>

<main class="form-container">

    <h1>A/S 신청</h1>

    <p class="description">
        신청 정보를 작성해주세요.<br>
        접수 완료 후 해당 브랜드 A/S 채널로 연결됩니다.
    </p>

    <div class="selected-brand" id="selectedBrand">
        선택 브랜드 확인 중...
    </div>

    <form id="asForm">

        <div class="form-group">
            <label for="customerName">고객명</label>
            <input type="text" id="customerName" required placeholder="고객명을 입력하세요">
        </div>

        <div class="form-group">
            <label for="phone">연락처</label>
            <input type="tel" id="phone" required placeholder="010-1234-5678">
        </div>

        <div class="form-group">
            <label for="brand">브랜드</label>

            <select id="brand" required>
                <option value="">브랜드 선택</option>
                <option value="아메리칸 스탠다드">아메리칸 스탠다드</option>
                <option value="더죤(필로토)">더죤(필로토)</option>
                <option value="폰타나">폰타나</option>
                <option value="에떼르노">에떼르노</option>
                <option value="리델">리델</option>
                <option value="힘펠">힘펠</option>
                <option value="베르사츠(인토)">베르사츠(인토)</option>
                <option value="라우체(화신)">라우체(화신)</option>
                <option value="대림바스">대림바스</option>
                <option value="히든바스">히든바스</option>
                <option value="카비원">카비원</option>
                <option value="스파이더">스파이더</option>
                <option value="트렌드주식회사">트렌드주식회사</option>
            </select>
        </div>

        <div class="form-group">
            <label for="product">제품명</label>
            <input type="text" id="product" required placeholder="예: 세면기, 양변기, 수전">
        </div>

        <div class="form-group">
            <label for="address">주소</label>
            <input type="text" id="address" required placeholder="A/S 방문 주소를 입력하세요">
        </div>

        <div class="form-group">
            <label for="content">A/S 내용</label>
            <textarea id="content" required placeholder="제품의 문제를 자세히 작성하세요"></textarea>
        </div>

        <div class="form-group photo-area">

            <label for="photoInput">문제 제품 사진</label>

            <p class="photo-description">
                문제 부위가 잘 보이는 사진을 선택해주세요.<br>
                최대 5장까지 선택할 수 있습니다.
            </p>

            <input
                type="file"
                id="photoInput"
                accept="image/*"
                multiple
            >

            <div class="photo-count" id="photoCount">
                선택된 사진 없음
            </div>

            <div
                class="preview-container"
                id="previewContainer">
            </div>

        </div>

        <button
            type="submit"
            class="submit-btn"
            id="submitButton">
            A/S 접수하기
        </button>

    </form>

    <div
        class="result-box"
        id="resultBox">
    </div>

    <button
        type="button"
        class="copy-btn"
        id="copyButton">
        신청내용 다시 복사하기
    </button>

    <div
        class="photo-buttons"
        id="photoButtons">
    </div>

    <button
        type="button"
        class="move-btn"
        id="moveButton">
        해당 업체 A/S 채널 열기
    </button>

    <a
        href="AsService.html"
        class="back-btn">
        ← 브랜드 선택으로 돌아가기
    </a>

</main>

<script type="module">

    import { db }
    from "./firebase-config.js";

    import { getApp }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    import {
        collection,
        doc,
        writeBatch,
        serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    const app = getApp();
    const auth = getAuth(app);

    const asForm = document.getElementById("asForm");
    const submitButton = document.getElementById("submitButton");
    const resultBox = document.getElementById("resultBox");

    const brandSelect =
        document.getElementById("brand");

    const selectedBrand =
        document.getElementById("selectedBrand");

    const copyButton =
        document.getElementById("copyButton");

    const moveButton =
        document.getElementById("moveButton");

    const photoInput =
        document.getElementById("photoInput");

    const photoCount =
        document.getElementById("photoCount");

    const previewContainer =
        document.getElementById("previewContainer");

    const photoButtons =
        document.getElementById("photoButtons");


    let copiedText = "";
    let destinationUrl = "";
    let selectedPhotos = [];


    /* =========================
       사진 복사 기능 적용 브랜드
    ========================== */

    const photoCopyBrands = [

        "대림바스",

        "라우체(화신)",

        "스파이더",

        "베르사츠(인토)",

        "카비원"

    ];


    /* =========================
       브랜드별 A/S 링크
    ========================== */

    const brandLinks = {

        "아메리칸 스탠다드":
            "https://standard-as.co.kr/main/as_afterservice/write.do",

        "더죤(필로토)":
            "https://piloto.co.kr/shop/cs/as_receipt/as_receipt_index",

        "폰타나":
            "https://pf.kakao.com/_xbsqFn",

        "에떼르노":
            "https://pf.kakao.com/_bMtNn",

        "리델":
            "https://liddel.co.kr/board/as-%EB%AC%B8%EC%9D%98/6/",

        "힘펠":
            "https://himpel.com/kr/asApplication",

        "베르사츠(인토)":
            "https://open.kakao.com/o/gts8OCKi",

        "라우체(화신)":
            "https://open.kakao.com/o/gC19dCKi",

        "대림바스":
            "https://open.kakao.com/o/gjPUOCKi",

        "히든바스":
            "https://hiddenbathorder.co.kr/loginForm",

        "카비원":
            "https://open.kakao.com/o/gi4IPCKi",

        "스파이더":
            "https://open.kakao.com/o/gJa2OCKi",

        "트렌드주식회사":
            "https://pf.kakao.com/_CxiAxmxj"

    };


    /* =========================
       로그인 확인
    ========================== */

    onAuthStateChanged(
        auth,
        function (user) {

            if (!user) {
                window.location.replace("index.html");
            }

        }
    );


    /* =========================
       URL 브랜드 자동 선택
    ========================== */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const brandFromUrl =
        params.get("brand");


    if (
        brandFromUrl &&
        brandLinks[brandFromUrl]
    ) {

        brandSelect.value =
            brandFromUrl;

        selectedBrand.textContent =
            "선택 브랜드 : " +
            brandFromUrl;

    } else {

        selectedBrand.textContent =
            "A/S 브랜드를 선택해주세요.";

    }


    brandSelect.addEventListener(
        "change",
        function () {

            selectedBrand.textContent =
                brandSelect.value
                ? "선택 브랜드 : " +
                  brandSelect.value
                : "A/S 브랜드를 선택해주세요.";

        }
    );


    /* =========================
       사진 선택
    ========================== */

    photoInput.addEventListener(
        "change",
        function () {

            const files =
                Array.from(
                    photoInput.files
                );

            if (files.length > 5) {

                alert(
                    "사진은 최대 5장까지 선택할 수 있습니다."
                );

                photoInput.value = "";

                selectedPhotos = [];

                renderPhotoPreview();

                return;
            }

            selectedPhotos = files;

            renderPhotoPreview();

        }
    );


    /* =========================
       사진 미리보기
    ========================== */

    function renderPhotoPreview() {

        previewContainer.innerHTML = "";

        if (
            selectedPhotos.length === 0
        ) {

            photoCount.textContent =
                "선택된 사진 없음";

            return;
        }

        photoCount.textContent =
            "선택된 사진 : " +
            selectedPhotos.length +
            "장";


        selectedPhotos.forEach(
            function (file, index) {

                const item =
                    document.createElement("div");

                item.className =
                    "preview-item";


                const image =
                    document.createElement("img");


                const objectUrl =
                    URL.createObjectURL(file);

                image.src = objectUrl;


                image.onload =
                    function () {

                        URL.revokeObjectURL(
                            objectUrl
                        );

                    };


                const name =
                    document.createElement("div");

                name.className =
                    "preview-name";

                name.textContent =
                    (index + 1) +
                    ". " +
                    file.name;


                item.appendChild(image);

                item.appendChild(name);

                previewContainer.appendChild(
                    item
                );

            }
        );

    }


    /* =========================
       접수번호 생성
    ========================== */

    function createReceiptNumber() {

        const now = new Date();

        const year =
            now.getFullYear();

        const month =
            String(
                now.getMonth() + 1
            ).padStart(2, "0");

        const day =
            String(
                now.getDate()
            ).padStart(2, "0");

        const randomNumber =
            Math.floor(
                100000 +
                Math.random() * 900000
            );

        return (
            "AS-" +
            year +
            month +
            day +
            "-" +
            randomNumber
        );

    }


    /* =========================
       텍스트 복사
    ========================== */

    async function copyToClipboard(
        text
    ) {

        try {

            if (
                navigator.clipboard &&
                window.isSecureContext
            ) {

                await navigator.clipboard.writeText(
                    text
                );

                return true;

            }

        } catch (error) {

            console.warn(
                "Clipboard API 실패:",
                error
            );

        }


        try {

            const textArea =
                document.createElement(
                    "textarea"
                );

            textArea.value = text;

            textArea.style.position =
                "fixed";

            textArea.style.left =
                "-9999px";

            document.body.appendChild(
                textArea
            );

            textArea.focus();

            textArea.select();


            const success =
                document.execCommand(
                    "copy"
                );


            document.body.removeChild(
                textArea
            );

            return success;

        } catch (error) {

            console.error(
                "텍스트 복사 실패:",
                error
            );

            return false;

        }

    }


    /* =========================
       이미지 PNG 변환
    ========================== */

    async function convertImageToPngBlob(
        file
    ) {

        const imageUrl =
            URL.createObjectURL(file);


        try {

            const img =
                new Image();


            await new Promise(
                function (
                    resolve,
                    reject
                ) {

                    img.onload =
                        resolve;

                    img.onerror =
                        reject;

                    img.src =
                        imageUrl;

                }
            );


            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                img.naturalWidth;

            canvas.height =
                img.naturalHeight;


            const context =
                canvas.getContext(
                    "2d"
                );


            context.drawImage(
                img,
                0,
                0
            );


            return await new Promise(
                function (
                    resolve,
                    reject
                ) {

                    canvas.toBlob(
                        function (blob) {

                            if (blob) {

                                resolve(blob);

                            } else {

                                reject(
                                    new Error(
                                        "이미지 변환 실패"
                                    )
                                );

                            }

                        },
                        "image/png"
                    );

                }
            );

        } finally {

            URL.revokeObjectURL(
                imageUrl
            );

        }

    }


    /* =========================
       이미지 클립보드 복사
    ========================== */

    async function copyPhotoToClipboard(
        file
    ) {

        if (
            !navigator.clipboard ||
            !window.ClipboardItem
        ) {

            throw new Error(
                "이 브라우저에서는 이미지 복사를 지원하지 않습니다."
            );

        }


        const pngBlob =
            await convertImageToPngBlob(
                file
            );


        const clipboardItem =
            new ClipboardItem({

                "image/png":
                    pngBlob

            });


        await navigator.clipboard.write(
            [clipboardItem]
        );

    }


    /* =========================
       사진별 복사 버튼
    ========================== */

    function createPhotoCopyButtons() {

        photoButtons.innerHTML = "";


        if (
            !photoCopyBrands.includes(
                brandSelect.value
            ) ||
            selectedPhotos.length === 0
        ) {

            photoButtons.style.display =
                "none";

            return;

        }


        photoButtons.style.display =
            "block";


        selectedPhotos.forEach(
            function (file, index) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";

                button.className =
                    "photo-copy-btn";

                button.textContent =
                    "사진 " +
                    (index + 1) +
                    " 복사하기";


                button.addEventListener(
                    "click",
                    async function () {

                        const originalText =
                            button.textContent;


                        button.disabled =
                            true;

                        button.textContent =
                            "사진 복사 중...";


                        try {

                            await copyPhotoToClipboard(
                                file
                            );


                            button.classList.add(
                                "copied"
                            );

                            button.textContent =
                                "✓ 사진 " +
                                (index + 1) +
                                " 복사 완료";


                            setTimeout(
                                function () {

                                    button.disabled =
                                        false;

                                    button.classList.remove(
                                        "copied"
                                    );

                                    button.textContent =
                                        originalText;

                                },
                                2500
                            );

                        } catch (error) {

                            console.error(
                                "사진 복사 오류:",
                                error
                            );


                            alert(
                                "사진을 클립보드에 복사하지 못했습니다.\n\n" +
                                "Chrome 또는 Edge 최신 버전에서 다시 시도해주세요.\n" +
                                "계속 안 되는 경우 카카오톡에서 사진을 직접 첨부해주세요."
                            );


                            button.disabled =
                                false;

                            button.textContent =
                                originalText;

                        }

                    }
                );


                photoButtons.appendChild(
                    button
                );

            }
        );

    }


    /* =========================
       신청내용 다시 복사
    ========================== */

    copyButton.addEventListener(
        "click",
        async function () {

            if (!copiedText) {
                return;
            }


            const success =
                await copyToClipboard(
                    copiedText
                );


            if (success) {

                copyButton.textContent =
                    "✓ 신청내용 복사 완료";


                setTimeout(
                    function () {

                        copyButton.textContent =
                            "신청내용 다시 복사하기";

                    },
                    2000
                );

            } else {

                alert(
                    "신청내용을 복사하지 못했습니다."
                );

            }

        }
    );


    /* =========================
       업체 페이지 열기
    ========================== */

    moveButton.addEventListener(
        "click",
        function () {

            if (!destinationUrl) {
                return;
            }


            window.open(
                destinationUrl,
                "_blank",
                "noopener,noreferrer"
            );

        }
    );


    /* =========================
       A/S 접수
    ========================== */

    asForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const selectedBrandValue =
                brandSelect.value;


            if (
                !selectedBrandValue ||
                !brandLinks[
                    selectedBrandValue
                ]
            ) {

                alert(
                    "A/S 브랜드를 선택해주세요."
                );

                return;

            }


            const customerName =
                document
                    .getElementById(
                        "customerName"
                    )
                    .value
                    .trim();


            const phone =
                document
                    .getElementById(
                        "phone"
                    )
                    .value
                    .trim();


            const product =
                document
                    .getElementById(
                        "product"
                    )
                    .value
                    .trim();


            const address =
                document
                    .getElementById(
                        "address"
                    )
                    .value
                    .trim();


            const content =
                document
                    .getElementById(
                        "content"
                    )
                    .value
                    .trim();


            if (
                !customerName ||
                !phone ||
                !product ||
                !address ||
                !content
            ) {

                alert(
                    "모든 항목을 입력해주세요."
                );

                return;

            }


            if (
                photoCopyBrands.includes(
                    selectedBrandValue
                ) &&
                selectedPhotos.length === 0
            ) {

                alert(
                    selectedBrandValue +
                    " A/S 접수는 문제 제품 사진을 1장 이상 선택해주세요."
                );

                return;

            }


            const receiptNumber =
                createReceiptNumber();


            const applicationData = {

                receiptNumber:
                    receiptNumber,

                customerName:
                    customerName,

                phone:
                    phone,

                brand:
                    selectedBrandValue,

                product:
                    product,

                address:
                    address,

                content:
                    content,

                photoCount:
                    selectedPhotos.length,

                status:
                    "접수 완료",

                createdAt:
                    serverTimestamp()

            };


            copiedText =
`[DNB PARTNER A/S 접수]

접수번호: ${receiptNumber}
브랜드: ${selectedBrandValue}
고객명: ${customerName}
연락처: ${phone}
제품명: ${product}
주소: ${address}
A/S 내용: ${content}

첨부 예정 사진: ${selectedPhotos.length}장

📷 아래에 문제 제품 사진을 함께 첨부합니다.`;


            destinationUrl =
                brandLinks[
                    selectedBrandValue
                ];


            try {

                submitButton.disabled =
                    true;

                submitButton.textContent =
                    "접수 중...";


                const batch =
                    writeBatch(db);


                const privateRef =
                    doc(
                        collection(
                            db,
                            "asApplications"
                        )
                    );


                batch.set(
                    privateRef,
                    applicationData
                );


                const publicRef =
                    doc(
                        db,
                        "asPublicStatus",
                        receiptNumber
                    );


                batch.set(
                    publicRef,
                    {

                        receiptNumber:
                            receiptNumber,

                        brand:
                            selectedBrandValue,

                        product:
                            product,

                        status:
                            "접수 완료",

                        createdAt:
                            serverTimestamp()

                    }
                );


                await batch.commit();


                const copySuccess =
                    await copyToClipboard(
                        copiedText
                    );


                asForm
                    .querySelectorAll(
                        "input:not([type='file']), select, textarea"
                    )
                    .forEach(
                        function (element) {

                            element.disabled =
                                true;

                        }
                    );


                photoInput.disabled =
                    true;


                submitButton.disabled =
                    true;

                submitButton.textContent =
                    "✓ 접수 완료";


                resultBox.style.display =
                    "block";


                if (
                    photoCopyBrands.includes(
                        selectedBrandValue
                    )
                ) {

                    resultBox.innerHTML = `

                        <strong>
                            A/S 접수가 완료되었습니다.
                        </strong>

                        <br><br>

                        접수번호<br>

                        <span class="receipt-number">
                            ${receiptNumber}
                        </span>

                        <br><br>

                        ${
                            copySuccess
                            ? "✓ 신청 내용이 자동으로 복사되었습니다."
                            : "신청내용 자동복사가 차단되었습니다. 아래 복사 버튼을 눌러주세요."
                        }

                        <div class="paste-guide">

                            <strong>
                                ${selectedBrandValue} 오픈카카오톡 전송 방법
                            </strong>

                            <br><br>

                            ① 아래
                            <strong>
                                ${selectedBrandValue} 오픈카카오톡 열기
                            </strong>
                            버튼을 누릅니다.

                            <br><br>

                            ② 카카오톡 메시지 입력창에서
                            <strong>Ctrl + V</strong>
                            를 눌러 신청내용을 붙여넣습니다.

                            <br><br>

                            ③ 다시 이 화면으로 돌아와
                            <strong>사진 1 복사하기</strong>
                            를 누릅니다.

                            <br><br>

                            ④ 카카오톡으로 돌아가
                            <strong>Ctrl + V</strong>
                            를 누르면 사진이 붙여넣어집니다.

                            <br><br>

                            ⑤ 사진이 여러 장이면
                            사진 2, 사진 3 순서로 반복합니다.

                            <br><br>

                            ⑥ 내용과 사진을 확인한 뒤 전송합니다.

                        </div>

                        <div class="photo-notice">

                            📷 선택된 사진 :
                            <strong>
                                ${selectedPhotos.length}장
                            </strong>

                            <br>

                            아래에 사진별 복사 버튼이 표시됩니다.

                        </div>

                    `;

                } else {

                    resultBox.innerHTML = `

                        <strong>
                            A/S 접수가 완료되었습니다.
                        </strong>

                        <br><br>

                        접수번호<br>

                        <span class="receipt-number">
                            ${receiptNumber}
                        </span>

                        <br><br>

                        ${
                            copySuccess
                            ? "✓ 신청 내용이 자동으로 복사되었습니다."
                            : "신청내용 자동복사가 차단되었습니다. 아래 복사 버튼을 눌러주세요."
                        }

                        <div class="paste-guide">

                            해당 업체 A/S 페이지 또는
                            카카오톡 채널이 열리면

                            <br>

                            복사된 신청 내용을 붙여넣고
                            필요한 경우 제품 사진을 첨부해주세요.

                        </div>

                    `;

                }


                copyButton.style.display =
                    "block";


                createPhotoCopyButtons();


                moveButton.style.display =
                    "block";


                moveButton.textContent =
                    photoCopyBrands.includes(
                        selectedBrandValue
                    )
                    ?
                    selectedBrandValue +
                    " 오픈카카오톡 열기"
                    :
                    selectedBrandValue +
                    " A/S 접수 페이지 열기";


                resultBox.scrollIntoView({

                    behavior:
                        "smooth",

                    block:
                        "start"

                });


            } catch (error) {

                console.error(
                    "A/S 접수 오류:",
                    error
                );


                alert(
                    "A/S 접수 중 오류가 발생했습니다.\n" +
                    "잠시 후 다시 시도해주세요."
                );


                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "A/S 접수하기";

            }

        }
    );

</script>

</body>
</html>
