<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>관리자 로그인 | DNB PARTNER</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #17365d,
                #274f7d
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 90%;
            max-width: 420px;

            padding: 40px 35px;

            background: #ffffff;
            border-radius: 18px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.18);
        }

        .logo {
            margin-bottom: 30px;

            color: #082d5c;

            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;

            text-align: center;
        }

        .logo span {
            color: #b98740;
        }

        h1 {
            margin: 0 0 10px;

            color: #082d5c;

            font-size: 25px;

            text-align: center;
        }

        .description {
            margin: 0 0 30px;

            color: #777777;

            font-size: 14px;
            line-height: 1.6;

            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #333333;

            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cccccc;
            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #123d70;

            box-shadow:
                0 0 0 3px rgba(18, 61, 112, 0.12);
        }

        .login-btn {
            width: 100%;

            margin-top: 5px;
            padding: 14px;

            border: none;
            border-radius: 25px;

            background: #123d70;
            color: #ffffff;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .login-btn:hover {
            background: #082d5c;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            display: none;

            margin-top: 18px;
            padding: 12px;

            background: #fff1f1;
            border: 1px solid #ffc4c4;
            border-radius: 8px;

            color: #c62828;

            font-size: 14px;
            line-height: 1.5;

            text-align: center;
        }

        .home-btn {
            display: block;

            margin-top: 22px;

            color: #666666;

            font-size: 14px;

            text-align: center;
            text-decoration: none;
        }

        .home-btn:hover {
            color: #082d5c;
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        DNB <span>PARTNER</span>
    </div>

    <h1>관리자 로그인</h1>

    <p class="description">
        관리자 계정으로 로그인하세요.
    </p>

    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                관리자 이메일
            </label>

            <input
                type="email"
                id="email"
                required
                autocomplete="username"
                placeholder="관리자 이메일 입력"
            >

        </div>

        <div class="form-group">

            <label for="password">
                비밀번호
            </label>

            <input
                type="password"
                id="password"
                required
                autocomplete="current-password"
                placeholder="비밀번호 입력"
            >

        </div>

        <button
            type="submit"
            class="login-btn"
            id="loginButton"
        >
            로그인
        </button>

    </form>

    <div
        class="error-message"
        id="errorMessage"
    ></div>

    <a
        href="index.html"
        class="home-btn"
    >
        메인으로 돌아가기
    </a>

</div>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    const firebaseConfig = {
        apiKey: "AIzaSyDJ4ITH9eyvRvf1lbjeQ6SvUKpvp1rJXWU",
        authDomain: "dnb-partner-as.firebaseapp.com",
        projectId: "dnb-partner-as",
        storageBucket: "dnb-partner-as.firebasestorage.app",
        messagingSenderId: "164320070124",
        appId: "1:164320070124:web:2a53d834c7080bc02318c9"
    };


    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);


    const loginForm =
        document.getElementById("loginForm");

    const loginButton =
        document.getElementById("loginButton");

    const errorMessage =
        document.getElementById("errorMessage");


    /*
        이미 로그인되어 있으면
        관리자 페이지로 이동
    */
    onAuthStateChanged(
        auth,
        function (user) {

            if (user) {

                window.location.replace(
                    "Admin.html"
                );
            }

        }
    );


    /*
        로그인 버튼
    */
    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            errorMessage.style.display =
                "none";


            loginButton.disabled =
                true;


            loginButton.textContent =
                "로그인 중...";


            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            } catch (error) {

                console.error(
                    "관리자 로그인 오류:",
                    error
                );


                errorMessage.style.display =
                    "block";


                if (
                    error.code ===
                    "auth/invalid-credential"
                    ||
                    error.code ===
                    "auth/user-not-found"
                    ||
                    error.code ===
                    "auth/wrong-password"
                ) {

                    errorMessage.textContent =
                        "이메일 또는 비밀번호가 올바르지 않습니다.";

                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    errorMessage.textContent =
                        "올바른 이메일 주소를 입력해주세요.";

                }

                else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    errorMessage.textContent =
                        "로그인 시도가 너무 많습니다. 잠시 후 다시 시도해주세요.";

                }

                else {

                    errorMessage.textContent =
                        "로그인 중 오류가 발생했습니다.";

                }


                loginButton.disabled =
                    false;


                loginButton.textContent =
                    "로그인";
            }

        }
    );

</script>

</body>
</html>
