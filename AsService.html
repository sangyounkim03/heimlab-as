<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>욕실 제품 A/S 접수 | DNB PARTNER</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #f8fafc);
            color: #111;
            min-height: 100vh;
        }

        .container {
            width: 720px;
            max-width: 92%;
            margin: 60px auto;
            padding: 40px;

            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .contact-note {
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 25px;
        }

        .kakao-select {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .button-link {
            display: flex;
            justify-content: center;
            align-items: center;

            width: 100%;
            min-height: 62px;
            padding: 18px;

            background: #fff;
            border: 2px solid #ddd;
            border-radius: 14px;

            color: #111;
            font-size: 15px;
            font-weight: 800;
            text-decoration: none;
            text-align: center;

            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);

            transition:
                transform 0.25s ease,
                background-color 0.25s ease,
                color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .button-link:hover {
            transform: translateY(-3px);
            color: #fff;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.13);
        }

        .american {
            border-color: #1565c0;
        }

        .american:hover {
            background: #1565c0;
        }

        .thezone {
            border-color: #f57c00;
        }

        .thezone:hover {
            background: #f57c00;
        }

        .fontana {
            border-color: #43a047;
        }

        .fontana:hover {
            background: #43a047;
        }

        .etterno {
            border-color: #00acc1;
        }

        .etterno:hover {
            background: #00acc1;
        }

        .ridel {
            border-color: #7cb342;
        }

        .ridel:hover {
            background: #7cb342;
        }

        .himpel {
            border-color: #3949ab;
        }

        .himpel:hover {
            background: #3949ab;
        }

        .versace {
            border-color: #8e24aa;
        }

        .versace:hover {
            background: #8e24aa;
        }

        .hwashin {
            border-color: #6d4c41;
        }

        .hwashin:hover {
            background: #6d4c41;
        }

        .daelim {
            border-color: #00897b;
        }

        .daelim:hover {
            background: #00897b;
        }

        .hidden {
            border-color: #455a64;
        }

        .hidden:hover {
            background: #455a64;
        }

        .kabi {
            border-color: #5e35b1;
        }

        .kabi:hover {
            background: #5e35b1;
        }

        .spider {
            border-color: #d32f2f;
        }

        .spider:hover {
            background: #d32f2f;
        }

        .domus {
            border-color: #546e7a;
        }

        .domus:hover {
            background: #546e7a;
        }

        .trend {
            border-color: #e53935;
        }

        .trend:hover {
            background: #e53935;
        }

        .disabled-link {
            cursor: default;
            opacity: 0.55;
        }

        .disabled-link:hover {
            transform: none;
            color: #111;
            background: #fff;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        .home-btn {
            display: block;
            width: 180px;
            margin: 30px auto 0;
            padding: 11px;

            background: #123d70;
            color: white;

            border-radius: 25px;

            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }

        .home-btn:hover {
            background: #082d5c;
        }

        @media (max-width: 600px) {
            .container {
                margin: 30px auto;
                padding: 25px 20px;
            }

            h1 {
                font-size: 23px;
            }

            .kakao-select {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <h1>🛠 욕실 제품 A/S 접수</h1>

    <p class="contact-note">
        A/S를 접수할 브랜드를 선택해주세요.<br>
        신청 정보를 작성한 후 해당 브랜드 A/S 채널로 연결됩니다.
    </p>

    <div class="kakao-select">

        <a
            class="button-link american"
            href="AsApply.html?brand=아메리칸%20스탠다드"
        >
            아메리칸 스탠다드
        </a>

        <a
            class="button-link thezone"
            href="AsApply.html?brand=더죤(필로토)"
        >
            더죤(필로토)
        </a>

        <a
            class="button-link fontana"
            href="AsApply.html?brand=폰타나"
        >
            폰타나
        </a>

        <a
            class="button-link etterno"
            href="AsApply.html?brand=에떼르노"
        >
            에떼르노
        </a>

        <a
            class="button-link ridel"
            href="AsApply.html?brand=리델"
        >
            리델
        </a>

        <a
            class="button-link himpel"
            href="AsApply.html?brand=힘펠"
        >
            힘펠
        </a>

        <a
            class="button-link versace"
            href="AsApply.html?brand=베르사츠(인토)"
        >
            베르사츠(인토)
        </a>

        <a
            class="button-link hwashin"
            href="AsApply.html?brand=라우체(화신)"
        >
            라우체(화신)
        </a>

        <a
            class="button-link daelim"
            href="AsApply.html?brand=대림바스"
        >
            대림바스
        </a>

        <a
            class="button-link hidden"
            href="AsApply.html?brand=히든바스"
        >
            히든바스
        </a>

        <a
            class="button-link kabi"
            href="AsApply.html?brand=카비원"
        >
            카비원
        </a>

        <a
            class="button-link spider"
            href="AsApply.html?brand=스파이더"
        >
            스파이더
        </a>

        <a
            class="button-link domus disabled-link"
            href="#"
            onclick="return false;"
        >
            도무스
        </a>

        <a
            class="button-link trend"
            href="AsApply.html?brand=트렌드주식회사"
        >
            트렌드주식회사
        </a>

    </div>

    <a href="Home.html" class="home-btn">
        메인으로 돌아가기
    </a>

</main>


<script type="module">

    import "./firebase-config.js";

    import {
        getApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    const app = getApp();
    const auth = getAuth(app);


    onAuthStateChanged(
        auth,
        function (user) {

            if (!user) {
                window.location.replace("index.html");
            }

        }
    );

</script>

</body>
</html>
