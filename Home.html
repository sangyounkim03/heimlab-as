<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DNB PARTNER</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            DNB <span>PARTNER</span>
        </div>

        <!--
        <nav>
            <a href="AsService.html">A/S</a>
        </nav>
        -->
    </header>

    <!-- HERO -->
    <section class="hero">

        <h1>DNB PARTNER</h1>

        <p>
            욕실 공간에 대한 깊은 이해와 전문성을 바탕으로<br>
            차별화된 욕실자재 및 시공 서비스를 제공합니다.
        </p>

    </section>

    <!-- SERVICES -->
    <section class="services">

        <div class="card">
            <h2>CUSTOMER CARE</h2>

            <p>
                배송부터 사후관리까지<br>
                고객 만족을 최우선으로 하는 서비스를 제공합니다.
            </p>
        </div>

        <div class="card">
            <h2>A/S SERVICE</h2>

            <p>
                전국 네트워크를 통해 빠르고 정확하게<br>
                문제를 해결해드립니다.
            </p>

            <a href="AsService.html" class="service-btn">
                A/S 접수하기
            </a>
        </div>

        <div class="card">
            <h2>A/S 신청 현황</h2>

            <p>
                접수된 A/S 신청 내역과<br>
                처리 상태를 확인할 수 있습니다.
            </p>

            <a href="AsStatus.html" class="service-btn">
                신청 현황 확인
            </a>
        </div>

    </section>

    <script src="script.js"></script>
<script type="module">

    import "./firebase-config.js";

    import {
        getApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    const app = getApp();
    const auth = getAuth(app);


    onAuthStateChanged(
        auth,
        function (user) {

            if (!user) {
                window.location.replace("index.html");
            }

        }
    );

</script>
</body>
</html>
